<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewellery Collections | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="top-header">

            <div class="brand">

                <img src="assets/tfgc logo.png" alt="Logo">

                <div class="brand-text">
                    <h2>Thapaswini</h2>
                    <span>Fashion Gold Covering</span>
                </div>

            </div>

            <div class="header-icons">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>

        </div>


        <!-- SEARCH -->

      <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>

    <input
        type="text"
        id="productSearchInput"
        placeholder="Search for jewellery..."
    >
</div>

    </header>



    <!-- PAGE TITLE -->

    <section class="products-header">

        <h1>Our Collections</h1>

        <p>
            Explore our beautiful fashion gold covering jewellery
        </p>

    </section>



    <!-- CATEGORY FILTER -->

    <section class="product-filter">

        <button class="filter active-filter">
            All
        </button>

        <button class="filter">
            Necklaces
        </button>

        <button class="filter">
            Earrings
        </button>

        <button class="filter">
            Bangles
        </button>

        <button class="filter">
            Rings
        </button>

        <button class="filter">
            Bridal
        </button>

    </section>



    <!-- PRODUCTS -->

    <section class="product-section">

        <div class="products-grid" id="productsGrid">


            <!-- Firebase products will appear here -->

            <div class="no-products">

                <i class="fa-solid fa-gem"></i>

                <h3>Collections Coming Soon</h3>

                <p>
                    Our latest jewellery collections
                    will be available here.
                </p>

            </div>


        </div>

    </section>



    <!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="products.html" class="nav-item active">
        <i class="fa-solid fa-table-cells-large"></i>
        <span>Products</span>
    </a>

    <a href="cart.html" class="nav-item">

        <div class="cart-icon-wrapper">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </div>

        <span>Cart</span>

    </a>

    <a href="profile.html" class="nav-item">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
    </a>

</nav>
<script src="script.js"></script>
<script type="module" src="products.js"></script>
