<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="top-header">

            <div class="brand">

                <img src="assets/tfgc logo.png" alt="Logo">

                <div class="brand-text">
                    <h2>Thapaswini</h2>
                    <span>Fashion Gold Covering</span>
                </div>

            </div>

        </div>

    </header>


    <!-- WISHLIST SECTION -->

    <section class="wishlist-section">

        <!-- BACK BUTTON -->
        <a href="profile.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>


        <div class="wishlist-header">

            <h1>My Wishlist ❤️</h1>

            <p>Your favourite jewellery collections</p>

        </div>


        <!-- WISHLIST PRODUCTS -->

        <div id="wishlistContainer">

            <div class="empty-wishlist">

                <i class="fa-regular fa-heart"></i>

                <h2>Your Wishlist is Empty</h2>

                <p>
                    Save your favourite jewellery here.
                </p>

                <a href="products.html" class="shop-now-btn">
                    Explore Products
                </a>

            </div>

        </div>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="products.html" class="nav-item">
            <i class="fa-solid fa-table-cells-large"></i>
            <span>Products</span>
        </a>

        <a href="cart.html" class="nav-item">
            <div class="cart-icon-wrapper">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-count">0</span>
</div>
            <span>Cart</span>
        </a>

        <a href="profile.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>


    <script src="wishlist.js"></script>

</body>
</html>
