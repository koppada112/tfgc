<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="top-header">

            <div class="brand">
                <img src="tfgc logo.png" alt="Logo">

                <div class="brand-text">
                    <h2>Thapaswini</h2>
                    <span>Fashion Gold Covering</span>
                </div>
            </div>

        </div>
    </header>


    <section class="profile-section">

    <div class="profile-card">

        <div class="profile-icon">
            <i class="fa-regular fa-user"></i>
        </div>

        <h2 id="profileWelcome">
            Welcome to Thapaswini
        </h2>

        <p id="profileEmail">
            Login to manage your profile,
            orders and wishlist.
        </p>

        <button
            class="login-btn"
            id="profileAuthBtn"
        >
            Login / Sign Up
        </button>

    </div>

</section>


    <!-- PROFILE OPTIONS -->

    <section class="profile-options">

    <a href="myorders.html" class="profile-option">
    <i class="fa-solid fa-box"></i>
    <span>My Orders</span>
    <i class="fa-solid fa-chevron-right arrow"></i>
</a>

      <a href="wishlist.html" class="profile-option">
    <i class="fa-regular fa-heart"></i>
    <span>Wishlist</span>
    <i class="fa-solid fa-chevron-right arrow"></i>
</a>
        <a href="addresses.html" class="profile-option">
    <i class="fa-solid fa-location-dot"></i>
    <span>Saved Addresses</span>
    <i class="fa-solid fa-chevron-right arrow"></i>
</a>

        <a href="support.html" class="profile-option">
    <i class="fa-solid fa-headset"></i>
    <span>Customer Support</span>
    <i class="fa-solid fa-chevron-right arrow"></i>
</a>
        <!---admin access option--->
        <a href="admin.html" class="profile-option admin-access">
    <i class="fa-solid fa-user-shield"></i>
    <span>Admin Access</span>
    <i class="fa-solid fa-chevron-right arrow"></i>
</a>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="products.html" class="nav-item">
            <i class="fa-solid fa-table-cells-large"></i>
            <span>Products</span>
        </a>

        <a href="cart.html" class="nav-item">
            <div class="cart-icon-wrapper">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-count">0</span>
</div>
            <span>Cart</span>
        </a>

        <a href="profile.html" class="nav-item active">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>
<script type="module" src="profile.js"></script>
</body>
</html>
