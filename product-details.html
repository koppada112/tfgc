<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Product Details | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="top-header">

            <div class="brand">

                <img
                    src="tfgc logo.png"
                    alt="Thapaswini Logo"
                >

                <div class="brand-text">

                    <h2>Thapaswini</h2>

                    <span>
                        Fashion Gold Covering
                    </span>

                </div>

            </div>

            <div class="header-icons">

                <i class="fa-regular fa-heart"></i>

                <i class="fa-solid fa-cart-shopping"></i>

            </div>

        </div>

    </header>


    <!-- PRODUCT DETAILS -->

    <main>

        <section class="product-details-section">

            <!-- BACK BUTTON -->

            <a href="products.html"
               class="details-back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                <span>Back</span>

            </a>


            <!-- PRODUCT DETAILS CARD -->

            <div id="productDetails">

                <div class="loading-product">

                    <i class="fa-solid fa-spinner"></i>

                    <p>
                        Loading product...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a href="index.html"
           class="nav-item">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>


        <a href="products.html"
           class="nav-item active">

            <i class="fa-solid fa-table-cells-large"></i>

            <span>Products</span>

        </a>


        <a href="cart.html"
           class="nav-item">

            <i class="fa-solid fa-cart-shopping"></i>

            <span>Cart</span>

        </a>


        <a href="profile.html"
           class="nav-item">

            <i class="fa-regular fa-user"></i>

            <span>Profile</span>

        </a>

    </nav>


    <!-- PRODUCT DETAILS JS -->

    <script
        type="module"
        src="product-details.js">
    </script>

</body>

</html>
