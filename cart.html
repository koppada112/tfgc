<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="top-header">

            <div class="brand">

                <img src="assets/tfgc logo.png" alt="Logo">

                <div class="brand-text">
                    <h2>Thapaswini</h2>
                    <span>Fashion Gold Covering</span>
                </div>

            </div>

            <div class="header-icons">
                <i class="fa-regular fa-heart"></i>
            </div>

        </div>

    </header>


    <!-- CART HEADER -->

    <section class="cart-header">

        <h1>My Cart</h1>

        <p>Your selected jewellery will appear here</p>

    </section>


    <!-- CART SECTION -->

   <section class="cart-section">

    <div id="cartItems">
        <!-- Cart products will appear here -->
    </div>

    <div class="cart-summary">

        <h3>Order Summary</h3>

        <div class="summary-row">
            <span>Total</span>
            <strong id="cartTotal">₹0</strong>
        </div>

        <a href="checkout.html" class="checkout-btn">
            Proceed to Checkout
        </a>

    </div>

</section>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="products.html" class="nav-item">
            <i class="fa-solid fa-table-cells-large"></i>
            <span>Products</span>
        </a>

        <a href="cart.html" class="nav-item active">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </a>

        <a href="profile.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>
<script src="cart.js"></script>
</body>
</html>
