<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cancel Order | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header class="cancel-header">

        <a href="myorders.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Cancel Order</h2>

    </header>


    <!-- CANCEL ORDER -->

    <main class="cancel-container">

        <div class="cancel-card">

            <div class="cancel-icon">
                <i class="fa-solid fa-box-open"></i>
            </div>

            <h2>Cancel Your Order?</h2>

            <p>
                Please select a reason for cancelling
                your order.
            </p>


            <!-- CANCELLATION REASONS -->

            <div class="cancel-reasons">

                <label class="cancel-option">

                    <input
                        type="radio"
                        name="cancelReason"
                        value="Ordered by mistake"
                    >

                    <span>
                        Ordered by mistake
                    </span>

                </label>


                <label class="cancel-option">

                    <input
                        type="radio"
                        name="cancelReason"
                        value="Found a better price"
                    >

                    <span>
                        Found a better price
                    </span>

                </label>


                <label class="cancel-option">

                    <input
                        type="radio"
                        name="cancelReason"
                        value="Changed my mind"
                    >

                    <span>
                        Changed my mind
                    </span>

                </label>


                <label class="cancel-option">

                    <input
                        type="radio"
                        name="cancelReason"
                        value="Other"
                    >

                    <span>
                        Other
                    </span>

                </label>

            </div>


            <!-- OTHER REASON -->

            <textarea
                id="otherReason"
                placeholder="Tell us more (optional)"
            ></textarea>


            <!-- CANCEL BUTTON -->

            <button
                class="confirm-cancel-btn"
                onclick="cancelOrder()"
            >

                <i class="fa-solid fa-xmark"></i>

                Confirm Cancellation

            </button>

        </div>

    </main>


    <script type="module"
        src="cancel-order.js">
    </script>

</body>

</html>
