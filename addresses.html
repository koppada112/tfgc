<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Addresses | Thapaswini</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="top-header">

            <div class="brand">

                <img src="assets/tfgc logo.png" alt="Logo">

                <div class="brand-text">
                    <h2>Thapaswini</h2>
                    <span>Fashion Gold Covering</span>
                </div>

            </div>

        </div>

    </header>


    <!-- ADDRESS PAGE -->

    <main class="addresses-page">

        <div class="addresses-header">

            <a href="profile.html" class="back-address-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div>
                <h1>Saved Addresses</h1>
                <p>Manage your delivery addresses</p>
            </div>

        </div>


        <!-- ADDRESS LIST -->

        <div id="addressesContainer">

            <div class="no-addresses">

                <i class="fa-solid fa-location-dot"></i>

                <h3>No Saved Addresses</h3>

                <p>
                    Add an address to make checkout faster.
                </p>

            </div>

        </div>


        <!-- ADD ADDRESS BUTTON -->

        <button
            class="add-address-btn"
            id="addAddressBtn"
        >

            <i class="fa-solid fa-plus"></i>

            Add New Address

        </button>


        <!-- ADDRESS FORM MODAL -->

        <div
            class="address-modal"
            id="addressModal"
        >

            <div class="address-modal-content">

                <div class="address-modal-header">

                    <h2>Add New Address</h2>

                    <button
                        class="close-address-modal"
                        id="closeAddressModal"
                    >
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                </div>


                <form id="addressForm">

                    <input
                        type="text"
                        id="addressName"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="tel"
                        id="addressPhone"
                        placeholder="Phone Number"
                        required
                    >

                    <textarea
                        id="addressText"
                        placeholder="House No, Street, Area"
                        required
                    ></textarea>

                    <input
                        type="text"
                        id="addressCity"
                        placeholder="City"
                        required
                    >

                    <input
                        type="text"
                        id="addressPincode"
                        placeholder="Pincode"
                        required
                    >


                    <button
                        type="submit"
                        class="save-address-btn"
                    >
                        Save Address
                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="products.html" class="nav-item">
            <i class="fa-solid fa-table-cells-large"></i>
            <span>Products</span>
        </a>

        <a href="cart.html" class="nav-item">
            <div class="cart-icon-wrapper">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count">0</span>
            </div>
            <span>Cart</span>
        </a>

        <a href="profile.html" class="nav-item active">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>


    <script src="script.js"></script>
    <script type="module" src="addresses.js"></script>

</body>

</html>
